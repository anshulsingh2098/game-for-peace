builds a road, deploy folder is current, assets and vendor sizes, every asset has a credit line, open team-log entries.","s":"todo","w":"You","r":"CHECKLIST.md"}]],["Checklist: Sync with the team",[{"id":"ab0514b1","t":"git switch main && git pull, or run /sync in Claude.","d":"git switch main && git pull, or run /sync in Claude.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a08f702f","t":"Read the newest entries in team/stream-a.md and team/stream-b.md; anything addressed to you and open is","d":"Read the newest entries in team/stream-a.md and team/stream-b.md; anything addressed to you and open is a task for today.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a8a21ea2","t":"HANDOFF.md \"What is next\" still matches reality; PARALLEL_PLAN.md status table is current.","d":"HANDOFF.md \"What is next\" still matches reality; PARALLEL_PLAN.md status table is current.","s":"todo","w":"You","r":"CHECKLIST.md"}]],["Checklist: Look at the game (desktop). Start python tools/serve.py, open http://localhost:8765/?play",[{"id":"a20641c0","t":"Default world","d":"Default world drives: keys steer, accelerate, brake; menu, garage, settings, pause (Esc) open and close.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a930c007","t":"Every location","d":"Every location loads from the picker: Green Valley, Alps, Himalayas, California, Southern Coast, Mumbai, Delhi, Agra. Ground, trees and road look right for the place.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a1387264","t":"Road styles","d":"Road styles: add &road=highway, boulevard, dirt, gravel: each renders, lines and kerbs present, no gaps or streaks.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a5dca301","t":"Shadows","d":"Shadows: trees, the car and rocks cast clean shadows: no black streaks, stripes or flicker on trees or the car (check the Alps at midday).","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a62f5ba9","t":"Ground","d":"Ground: photographic grass, rock on cliffs, snow, sand. No seams at tile edges, no shimmering as you drive. Compare with &ground=flat.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a4cd180d","t":"Scenery","d":"Scenery: real trees, shrubs and rocks, no dark fringes or flicker. Compare with &nature=flat.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a58271ec","t":"Bridge","d":"Bridge: drive onto one (Alps, seed alps, near road distance 340; it is 726 m long and has a steel truss on both sides: top chord, uprights and diagonals, lined up from piece to piece with no gaps; short bridges have rails only): deck, rails, piers; the car rides the deck. Rails stop the car: steer into one at speed, the car scrapes or stops and never goes over the edge (try the car, truck and bike). Rails sit just w…","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a140db90","t":"Tunnel","d":"Tunnel (Himalayas, seed hill): gate with a readable \"ATAL TUNNEL, ROHTANG\" board, portal, tiled lit interior, cones, a raised walkway along both walls, speed-limit (60), green EXIT and orange SOS signs on the walls, camera stays inside, no rain inside. Try the truck.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a08b97d5","t":"Weather and time","d":"Weather and time: clear, overcast, fog, rain, storm, snow, each at day, dusk and night: nothing goes black or white, road looks wet in rain, tunnel and bridge look right at night.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a629d309","t":"Driving controls","d":"Driving controls: W / Up gas, S / Down reverse (brakes first if still rolling forward, then reverses), Space foot brake (stops and holds the car, never reverses), X handbrake (the tail slides), Shift boost, E autodrive. On a phone: Brake, Hand, Rev and Boost circles. Lifting off the gas slows the car at a natural rate, on grass much faster than on the road (it must not glide). Measured: 100 km/h to a stop in about 3…","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a27576e5","t":"Engine sound","d":"Engine sound is the real recording of Rajul's car (seven seamless loops in assets/audio, made by tools/make_engine_loops.mjs): deep and bold, no thin whine, smooth through the gears, no swirling or clicking at loop points, no sudden jumps when the revs change. ?engine=synth plays the old synthesised engine for comparison. Nobody has listened to it yet: judge by ear and say what is off. If it still sounds unnatural t…","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"aa06b427","t":"Camera views","d":"Camera views: V cycles Chase, Far chase, Close chase, Hood, Bumper, Driver seat, Cinematic (a TV-style cut beside the road) and back; C jumps to the driver's seat and back; the Camera button and the CAM circle on a phone do the same as V. Each view shows the road ahead, nothing clips through the car body, and the choice is remembered.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"ad965d85","t":"Car feel","d":"Car feel (drive by hand, any vehicle): the nose rises a little when you accelerate and dips when you brake hard; the body leans outward in a fast corner; a faint tremble at speed, stronger on gravel and grass. It should not feel like gliding on rails. (Measured on the car: about 3 degrees squat on launch, about 4 degrees dip under hard braking, about 4.5 degrees of lean at 0.5 g sideways.)","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"aebf4af0","t":"The car","d":"The car (\"Dusk GT\", Khronos CarConcept): glossy paint with reflections, dark glass, lit tail lights, plain licence plate; no Khronos or 3D Commerce logo anywhere (look at the tyre sidewalls and the plate up close); the four wheels turn and the front ones steer; the garage colour swatches recolour the body; driver's-seat view (V or C) shows a full interior with the steering wheel and dash.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a316fb23","t":"Handling","d":"Handling (car): steering reacts at once (not numb) at 50, 100 and 200 km/h; no spin at full lock at top speed; a handbrake flick at 100 km/h gives a slide you can hold and catch; gears change with a small power dip and the revs drop at each shift; the rev limiter holds at the top.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"ac764ad7","t":"Look","d":"Look: richer colour and a soft dark edge (grade and vignette); trees are full and green with no black rectangles in sunlight; the car's paint shows a horizon and sky in its reflection.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a225058d","t":"Camera effects","d":"Camera effects: the view stretches a little when you boost or launch hard; no camera shake by default.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"adabe48f","t":"Autodrive","d":"Autodrive (press E, or the Auto button): the car follows the road by itself at about 70 km/h, slows for bends, goes through tunnels and over bridges; steering or braking by hand takes over. Try the Himalayas (seed hill) and the default world. With traffic on, it drives in its own lane (right, or left in India), follows a slower car at a gap, and never hits a car.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a994bc99","t":"Green Valley","d":"Green Valley looks like open meadow with tall grass and trees set back from the road, not a forest at the verge.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"abeaaa02","t":"Quality tiers","d":"Quality tiers: add &q=low, &q=med, &q=high. Low: old cheap ground, fewer tree variants, no shadows; med: lighter photographic ground; high: full ground, bigger shadows and view. Each looks acceptable and none shows broken ground. Phones start on low. (Draw calls and triangles for the Alps at 1400x800: low 176 / 96k, med 523 / 430k, high 898 / 895k. High took about 24 ms on an M4: too slow, still to be tuned.)","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a85dab35","t":"Vehicles","d":"Vehicles: the garage lists Dusk GT (your original sports car with the striped paint), Freight Hauler, Volt Bike and Aero Concept (the new detailed coupe); all four drive; paint colours work; white paint does not glare to a white blob.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"afdb807f","t":"Radio and sound","d":"Radio and sound: radio wheel (hold Q) plays a station; engine, wind and rain sounds; no rain, snow or thunder sound or picture inside a tunnel (try the Himalayas, seed hill, rain).","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a8661980","t":"Traffic","d":"Traffic (Settings > Traffic: Off, Low, Mid, High; Off on phones, Low on medium, Mid on high by default): the cars are real vehicle shapes (sedans, SUVs, vans, taxis, police, ambulance, trucks, garbage and fire trucks) in many colours, not boxes; they drive in their own lanes on the right (on the left in Mumbai, Delhi and Agra), oncoming cars pass on the other side; none appear close to you; a car behind or ahead kee…","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a94c9497","t":"My music","d":"My music: in the radio wheel press \"Add my songs\" and pick a few audio files (also try a text file and a very large file: they are left out with a message). A \"My music\" tab appears, the songs play one after another and loop, \"Next song\" skips, \"Radio off\" stops. After a reload the songs are gone (they are never uploaded or stored); check that nothing was sent over the network (browser network panel).","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a2d7675e","t":"Controller rumble","d":"Controller rumble (a gamepad that can vibrate): a thump on hitting something, a light buzz on gravel or grass, a rumble in a slide, a push on boost; Settings > Controller rumble > Off stops it. Playing with no gamepad works exactly as before.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a7dc3774","t":"Overpass","d":"Overpass (?play&q=med&india=world&at=agra, then find the crossings in the console: __next.branches.find(b => b.id === 'ns').road.lifts): the six-lane NH44 rises on a concrete deck with parapets and piers over the road below, twice; drive over it, then under it (Travel or Back to road onto the Golden Quadrilateral): the car stays on its level, nothing invisible stops it, the sky road does not catch the wheels, traffi…","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"ae789326","t":"Saved choices","d":"Saved choices: in the browser console localStorage.setItem('gfp-next', '{\"paint\":null,\"radioVol\":\"loud\",\"vehicle\":\"x\"}') then reload: the game starts normally with defaults and no red errors.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a2f6076c","t":"City overlaps (22 Nov 2026):","d":"City overlaps (22 Nov 2026): open ?play&q=med&india=world&at=agra, then at=delhi and at=mumbai; fly or drive round the station and the main road and look from above (Camera button): no building, lamp or tree stands on a track, a station or another highway, and no two buildings pass through each other. Write what you find in your team log.","s":"todo","w":"You","r":"CHECKLIST.md"}]],["Checklist: Tuner (http://localhost:8765/tuner.html)",[{"id":"ac07e711","t":"Panel connects (\"about 290 settings\"). Move a weather fog slider: the game changes live.","d":"Panel connects (\"about 290 settings\"). Move a weather fog slider: the game changes live.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a2be4c63","t":"A vehicle mass change rebuilds the car; a world setting regenerates the map.","d":"A vehicle mass change rebuilds the car; a world setting regenerates the map.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a51d40cc","t":"\"i\" button shows text and a range for any setting you try. Reset all, Export, Import work. Each section head","d":"\"i\" button shows text and a range for any setting you try. Reset all, Export, Import work. Each section header has a \"Reset section\" button that shows only while something in it has changed, and resets only that section. New groups: handling, camera, look.","s":"todo","w":"You","r":"CHECKLIST.md"},{"id":"a8628873","t":"Publish: only after the Cloudflare setup (see HANDOFF.md): wrong password is refused, right password publish","d":"Publish: only after the Cloudflare setup (see HAN
