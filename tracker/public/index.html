/* ===================== view ===================== */
let tab = (location.hash || '').replace('#', '') || 'dash', q = '', sf = 'all'; const open = new Set();

function setProgress() { const all = allItems(), c = counts(all); const p = c.total ? Math.round(100 * c.done / c.total) : 0; document.getElementById('obar').style.width = p + '%'; document.getElementById('opct').textContent = p + '%'; }

const pill = s => el('span', { class: 'pill p-' + s, text: STATUS[s] });

function itemNode(it) {

  if (isOpen) {
    const ta = el('textarea', { id: 'rm-' + it.id, placeholder: 'Remarks: your decision, a link, what you saw', value: v.remark, disabled: !canWrite, oninput: e => save(it.id, { remark: e.target.value }, 700) });
    const cin = el('input', { type: 'text', id: 'ci-' + it.id, placeholder: 'Add a comment', disabled: !canWrite });
    const add = () => { const t = cin.value.trim(); if (!t) return; save(it.id, { comments: [...v.comments, { at: Date.now(), text: t }] }); cin.value = ''; render(); };

      it.custom && canWrite ? el('div', null, el('button', { class: 'btn ghost', onclick: () => delCustom(it.id) }, 'Remove this item')) : null));
  }
  return node;
}

function listView(t) {
  const frag = el('div', { class: 'list' }); const meta = TABS.find(x => x.id === t.id);
  if (meta.intro) frag.append(el('div', { class: 'det', text: meta.intro }));
  const tools = el('div', { class: 'tools' }); const search = el('input', { type: 'search', id: 'srch', placeholder: 'Search this tab', value: q, 'aria-label': 'Search', oninput: e => { q = e.target.value; keepFocus('srch', renderBody); } });
  tools.append(search); for (const k of ['all', 'done', 'doing', 'todo', 'blocked', 'nope', 'note']) tools.append(el('button', { class: 'chip', 'aria-pressed': String(sf === k), onclick: () => { sf = k; render(); } }, k === 'all' ? 'All' : STATUS[k]));
  frag.append(tools);
  const all = tabItems(t.id).filter(it => { const v = cur(it); if (sf !== 'all' && v.status !== sf) return false; if (!q) return true; const h = (it.t + ' ' + it.d + ' ' + (it.r || '') + ' ' + (it.w || '') + ' ' + v.remark + ' ' + v.comments.map(c => c.text).join(' ')).toLowerCase(); return h.includes(q.toLowerCase()); });
  const groups = []; for (const it of all) { let g = groups.find(x => x.n === it.group); if (!g) groups.push(g = { n: it.group, l: [] }); g.l.push(it); }
  if (!groups.length) frag.append(el('div', { class: 'empty', text: 'Nothing matches. Clear the search or the status filter.' }));
  for (const g of groups) { const c = counts(g.l); frag.append(el('div', { class: 'gh' }, g.n, el('span', { text: c.done + ' of ' + c.total + ' done' })), ...g.l.map(itemNode)); }
  if (canWrite) { const inp = el('input', { type: 'text', id: 'addin', placeholder: 'Add your own item to this tab', 'aria-label': 'New item' }); const go = () => { addCustom(t.id, inp.value); }; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); frag.append(el('div', { class: 'add', style: 'margin-top:8px' }, inp, el('button', { class: 'btn', onclick: go }, 'Add item'))); }
  return frag;
}

function dashView() {
  const all = allItems(), c = counts(all), wrap = el('div', { style: 'display:flex;flex-direction:column;gap:14px' });
  wrap.append(el('div', { class: 'panel' }, el('h2', { text: 'Overall' }), el('div', { class: 'stats' },
    [['Items', c.total, ''], ['Done', c.done, 's-done'], ['In progress', c.doing, 's-doing'], ['To do', c.todo, ''], ['Waiting on someone', c.blocked, 's-blocked'], ['Cannot be done', c.nope, 's-nope']].map(([n, v, k]) => el('div', { class: 'stat ' + k }, el('b', { text: v }), el('span', { text: n }))))));
  const g = el('div', { class: 'grid' });
  const tabsP = el('div', { class: 'panel' }, el('h2', { text: 'Progress by tab' })); for (const t of TABS.filter(x => x.id !== 'dash')) { const n = counts(tabItems(t.id)), p = n.total ? Math.round(100 * n.done / n.total) : 0; tabsP.append(el('div', { class: 'tabrow' }, el('button', { onclick: () => { tab = t.id; location.hash = t.id; render(); } }, t.name), el('div', { class: 'bar' }, el('i', { style: 'width:' + p + '%' })), el('div', { class: 't', text: n.done + '/' + n.total }))); }
  g.append(tabsP);
  const factsP = el('div', { class: 'panel' }, el('h2', { text: 'Current status' }), el('dl', { class: 'kv' }, FACTS.map(([k, v]) => [el('dt', { text: k }), el('dd', { text: v })]).flat())); g.append(factsP);
  wrap.append(g);
  const need = allItems().filter(it => { const v = cur(it); return v.status === 'blocked' && !v.done; });
  const needP = el('div', { class: 'panel' }, el('h2', { text: 'Waiting on someone (' + need.length + ')' }));
  if (!need.length) needP.append(el('div', { class: 'det', text: 'Nothing is waiting.' }));
  else { const t = el('table'); t.append(el('tr', null, el('th', { text: 'Who' }), el('th', { text: 'What' }), el('th', { text: 'Tab' }))); for (const it of need) t.append(el('tr', null, el('td', { class: 'num', text: it.w || '' }), el('td', { text: it.t }), el('td', { class: 'num', text: TABS.find(x => x.id === it.tab).name }))); needP.append(el('div', { class: 'scroll' }, t)); }
  wrap.append(needP);
  const next = allItems().filter(it => it.tab === 'phases' && cur(it).status === 'todo').slice(0, 6);
  wrap.append(el('div', { class: 'panel' }, el('h2', { text: 'Next up in the phases' }), el('div', { class: 'list' }, next.map(it => el('div', { class: 'det', text: '• ' + it.t })))));
  const pt = el('table'); pt.append(el('tr', null, el('th', { text: 'PR' }), el('th', { text: 'What' }), el('th', { text: 'State' })));
  for (const [n, t, s] of PRS) pt.append(el('tr', null, el('td', { class: 'num', text: '#' + n }), el('td', { text: t }), el('td', null, el('span', { class: 'pill ' + (s === 'merged' ? 'p-done' : 'p-doing'), text: s }))));
  wrap.append(el('div', { class: 'panel' }, el('h2', { text: 'Pull requests (anshulsingh2098/game-for-peace)' }), el('div', { class: 'scroll' }, pt)));
  wrap.append(el('div', { class: 'panel' }, el('h2', { text: 'Share' }), el('div', { class: 'tools' }, el('button', { class: 'btn', onclick: copySummary }, 'Copy summary as text'), el('span', { class: 'det', text: 'Everything with its status, remarks and comments, ready to paste to Claude or Anshul.' }))));
  return wrap;
}
function copySummary() {
  const out = ['# Game for Peace Tracker', new Date().toLocaleString(), ''];
  for (const t of TABS.filter(x => x.id !== 'dash')) { out.push('## ' + t.name); let g = ''; for (const it of tabItems(t.id)) { const v = cur(it); if (it.group !== g) { g = it.group; out.push('### ' + g); } out.push('- [' + (v.done ? 'x' : ' ') + '] ' + it.t + ' (' + STATUS[v.status] + (it.w ? ', ' + it.w : '') + ')' + (v.remark ? '\n  remark: ' + v.remark : '') + v.comments.map(c => '\n  comment: ' + c.text).join('')); } out.push(''); }
  const text = out.join('\n'); const fallback = () => { const ta = el('textarea', { style: 'position:fixed;left:-999px' }); ta.value = text; document.body.append(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy not allowed here'); } ta.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); else fallback();
}

let pending = false;
function keepFocus(id, fn) { fn(); const e = document.getElementById(id); if (e) { e.focus(); const n = e.value.length; try { e.setSelectionRange(n, n); } catch (x) { /* ignore */ } } }
function renderBody() { const main = document.getElementById('main'); main.textContent = ''; if (needKey) { main.append(unlockPanel()); return; } if (usingLocal) main.append(el('div', { class: 'banner', text: 'Saving only in this browser: sign in to the artifact to share the checklist.' })); if (!canWrite) main.append(el('div', { class: 'banner', text: 'You can read this page but not change it.' })); const t = TABS.find(x => x.id === tab) || TABS[0]; main.append(t.id === 'dash' ? dashView() : listView(t)); }
function render() { const a = document.activeElement; if (a && a.tagName === 'TEXTAREA' && document.getElementById('main').contains(a) && !render.force) { pending = true; return; } pending = false; setProgress(); renderTabs(); renderBody(); }
document.addEventListener('focusout', () => { setTimeout(() => { if (pending) render(); }, 50); });
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (TABS.some(t => t.id === h) && h !== tab) { tab = h; render(); } });

/* ===================== start: render at once from the built-in content, then connect the shared store ===================== */
try { const raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw) { state = raw.state || {}; custom = raw.custom || {}; } } catch (e) { /* no stored copy */ }
if (!TABS.some(t => t.id === tab)) tab = 'dash';
render();
(async () => {
  try {
    if (typeof claude === 'undefined' || !claude.use) { await startApi(); return; }
    const [d, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!d) { usingLocal = true; render(); return; }
    db = d; usingLocal = false; state = {}; custom = {};
    try { const w = user && user.can ? await user.can('data.write') : null; if (w === false) { canWrite = false; } } catch (e) { /* not told */ }
    let timer = setTimeout(() => toast('Shared data is slow to answer'), 10000);
    db.collection('items').onSnapshot(s => { clearTimeout(timer); const n = {}; s.docs.forEach(x => { n[x.id] = x.data(); }); state = n; render(); }, e => { clearTimeout(timer); if (e && e.code !== 'revoked') toast('Could not read shared data'); });
    db.collection('custom').onSnapshot(s => { const n = {}; s.docs.forEach(x => { n[x.id] = x.data(); }); custom = n; render(); }, () => {});
  } catch (e) { if (!api) { usingLocal = true; render(); } }
})();
