<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Game for Peace: Tuner</title>
<style>
  :root { --bg: #14171c; --panel: #1b1f26; --line: #2a303a; --ink: #e8ecf2; --dim: #8a93a3; --accent: #7fd46a; --hot: #ffb347; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 400px 1fr; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .02em; }
  header .sp { flex: 1; }
  select, button, input[type=search] { background: #232933; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; }
  button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #10200c; border-color: var(--accent); font-weight: 600; }
  #side { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 8px 8px 40px; }
  #search { width: 100%; margin-bottom: 8px; }
  #game { width: 100%; height: 100%; border: 0; background: #000; }
  details { margin: 2px 0; } details > summary { cursor: pointer; padding: 5px 6px; border-radius: 5px; color: var(--ink); list-style: none; }
  details > summary::before { content: "▸ "; color: var(--dim); } details[open] > summary::before { content: "▾ "; }
  details > summary:hover { background: #232933; } details.top > summary { font-weight: 700; font-size: 14px; color: var(--accent); }
  details .in { margin-left: 10px; padding-left: 8px; border-left: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 1fr 110px 62px 14px; gap: 6px; align-items: center; padding: 2px 4px; }
  .row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.changed label { color: var(--hot); }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row input[type=number] { width: 62px; padding: 2px 4px; }
  .row input[type=color] { width: 62px; height: 24px; padding: 0; border: 1px solid var(--line); background: none; grid-column: 2 / 4; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; cursor: pointer; } .changed .dot { background: var(--hot); }
  #status { color: var(--dim); } #count { color: var(--hot); }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 55vh 1fr; } #side { border-right: 0; } }
</style>
</head>
<body>
<header>
  <h1>Game for Peace · Tuner</h1>
  <select id="loc" title="Location"></select>
  <select id="veh" title="Vehicle"></select>
  <select id="wx" title="Weather"><option>clear</option><option>overcast</option><option>fog</option><option>rain</option><option>storm</option><option>snow</option><option>auto</option></select>
  <select id="tm" title="Time"><option>day</option><option>dawn</option><option>dusk</option><option>night</option><option>auto</option></select>
  <button id="newWorld">New world</button><button id="toRoad">Back to road</button>
  <span class="sp"></span>
  <span id="status">connecting…</span><span id="count"></span>
  <button id="reset">Reset all</button><button id="import">Import…</button><button id="export" class="primary">Export settings.json</button>
  <select id="hist" title="Earlier published versions (loads into the panel, does not publish)"><option value="">History…</option></select>
  <button id="pull" title="Replace the panel with what is live now">Load live</button>
  <button id="publish" class="primary" title="Make these settings live for everyone who opens the game">Publish</button>
  <input id="file" type="file" accept="application/json" hidden>
</header>
<aside id="side"><input id="search" type="search" placeholder="Search settings (mass, fog, grip…)"><div id="tree"></div></aside>
<iframe id="game" title="Game preview" src="next.html?play&q=med"></iframe>
<script type="module" src="src/tuner/tuner.js"></script>
</body>
</html>
