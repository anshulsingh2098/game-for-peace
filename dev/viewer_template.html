<title>Garage Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: one full-width stage with the model, tabs above, a small spec strip below. Dark studio only, by choice. */
:root{
  --bg:#0d1018; --stage:#141926; --line:#262d40; --ink:#eef0f5; --ink2:#9aa3b8; --accent:#ffb36b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-block:20px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:600 clamp(1.8rem,5vw,2.6rem)/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.hint{color:var(--ink2);font-size:.85rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink2);padding:9px 18px;border-radius:999px;
  font:500 .95rem var(--body);cursor:pointer;transition:all .2s}
.tab:hover{color:var(--ink);border-color:var(--ink2)}
.tab[aria-pressed="true"]{background:var(--ink);color:#10131c;border-color:var(--ink)}
.tab:focus-visible,.sw:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;flex:1;min-height:340px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 30%,#1c2335,var(--stage) 60%,#0f131d)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);pointer-events:none;transition:opacity .4s}
.load.done{opacity:0}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.specs{display:flex;gap:22px;flex-wrap:wrap}
.spec b{display:block;font:600 1.25rem var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.spec span{color:var(--ink2);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;font:500 .85rem var(--body);cursor:pointer}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
label.t{color:var(--ink2);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}
</style>

<header><h1>Garage Preview</h1><span class="hint">Drag to rotate · scroll or pinch to zoom</span></header>
<div class="tabs" id="tabs" role="group" aria-label="Vehicle"></div>
<div class="stage"><canvas id="c"></canvas><div class="load" id="load">Loading model…</div></div>
<div class="row">
  <div class="specs" id="specs"></div>
  <div class="tools"><label class="t" id="payl" for="paint0">Paint</label><span id="swatches" style="display:flex;gap:8px"></span>
    <button class="btn" id="spin" aria-pressed="true">Auto-rotate</button></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODELS = __MODELS__;
const PAINT_MATS = { car: [], truck: ['Paint_Cab', 'Paint_Trailer'], bike: ['Paint_Panel'] };
const SWATCHES = ['#ff6a00', '#d62828', '#1d6fe0', '#2a9d5b', '#f2f2f2', '#16181d'];

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.2; controls.maxPolarAngle = Math.PI * 0.49;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-6, 9, 8); scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x10141e, roughness: 0.6, metalness: 0.2 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const loader = new GLTFLoader();
const cache = {}; let current = null, currentKey = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;

function fit(obj) {
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  obj.position.x -= ctr.x; obj.position.z -= ctr.z; obj.position.y -= box.min.y;
  const r = Math.max(size.x, size.z, size.y * 1.4);
  const d = r * 1.55 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.55;
  camera.position.set(d * 0.75, size.y * 0.7 + d * 0.28, d * 0.75);
  controls.target.set(0, size.y * 0.42, 0); controls.minDistance = r * 0.8; controls.maxDistance = r * 6; controls.update();
  floor.scale.setScalar(Math.max(1, r / 6)); key.position.set(-r, r * 1.6, r * 1.2);
  return size;
}
function stats(obj, size, name) {
  let tris = 0, parts = 0;
  obj.traverse(o => { if (o.isMesh) { parts++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  const f = n => n.toFixed(1);
  document.getElementById('specs').innerHTML =
    `<div class="spec"><b>${name}</b><span>Model</span></div><div class="spec"><b>${Math.round(tris).toLocaleString()}</b><span>Triangles</span></div>` +
    `<div class="spec"><b>${f(size.z)} m</b><span>Length</span></div><div class="spec"><b>${f(size.x)} m</b><span>Width</span></div><div class="spec"><b>${f(size.y)} m</b><span>Height</span></div>`;
}
function swatches(k, obj) {
  const box = document.getElementById('swatches'), names = PAINT_MATS[k]; box.innerHTML = '';
  document.getElementById('payl').style.display = box.style.display = names.length ? '' : 'none';
  if (!names.length) return;
  const mats = []; obj.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (names.includes(m.name) && !mats.includes(m)) mats.push(m); }); });
  SWATCHES.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.setAttribute('aria-label', 'Paint ' + c); b.setAttribute('aria-pressed', 'false'); if (i === 0) b.id = 'paint0';
    b.onclick = () => { mats.forEach(m => m.color.set(c)); [...box.children].forEach(x => x.setAttribute('aria-pressed', x === b)); };
    box.appendChild(b);
  });
}
function show(k) {
  const m = MODELS[k]; currentKey = k;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.k === k));
  const apply = gltf => {
    if (currentKey !== k) return;
    if (current) scene.remove(current);
    current = gltf.scene; scene.add(current);
    const size = fit(current); stats(current, size, m.name); swatches(k, current);
    document.getElementById('load').classList.add('done');
  };
  if (cache[k]) return apply(cache[k]);
  document.getElementById('load').classList.remove('done');
  loader.parse(b64(m.b64), '', g => { cache[k] = g; apply(g); }, e => { document.getElementById('load').textContent = 'Could not load this model.'; console.error(e); });
}
const tabs = document.getElementById('tabs');
Object.entries(MODELS).forEach(([k, m]) => {
  const b = document.createElement('button'); b.className = 'tab'; b.dataset.k = k; b.textContent = m.name; b.onclick = () => show(k); tabs.appendChild(b);
});
const spin = document.getElementById('spin');
spin.onclick = () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', controls.autoRotate); };
canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; spin.setAttribute('aria-pressed', 'false'); });

function resize() { const r = canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas.parentElement); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
show('car');
</script>
